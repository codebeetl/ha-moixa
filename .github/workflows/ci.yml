name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[test]"
      - name: Run pytest
        run: pytest tests/ -v

  release:
    name: Bump version and release
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version in manifest.json
        id: version
        run: |
          current=$(jq -r .version custom_components/moixa/manifest.json)
          IFS='.' read -r major minor patch <<< "$current"
          new="$major.$minor.$((patch + 1))"
          jq --arg v "$new" '.version = $v' custom_components/moixa/manifest.json > tmp.json \
            && mv tmp.json custom_components/moixa/manifest.json
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Commit bumped manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/moixa/manifest.json
          git commit -m "Bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git pull --rebase
          git push

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            --title "v${{ steps.version.outputs.new }}" \
            --generate-notes
