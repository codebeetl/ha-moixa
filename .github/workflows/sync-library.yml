name: Sync moixa-api library

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync from codebeetl/moixa-api
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Clone moixa-api
        run: git clone --depth 1 https://github.com/codebeetl/moixa-api.git /tmp/moixa-api

      - name: Sync library files
        run: |
          rsync -av --delete --exclude='cli.py' \
            /tmp/moixa-api/moixa_api/ \
            custom_components/moixa/moixa_api/

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain custom_components/moixa/moixa_api/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/moixa/moixa_api/
          git commit -m "Sync moixa-api library from upstream"
          git push
