[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-moixa"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "pycognito>=0.3.0",
    "aws-requests-auth>=0.4.3",
    "boto3>=1.26.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-homeassistant-custom-component>=0.13.205",
    "syrupy>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["custom_components.moixa"]
